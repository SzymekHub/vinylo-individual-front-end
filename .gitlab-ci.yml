stages:
  - build
  - docker-compose-up
  - test
  - docker-compose-down
  - docker

image:
  name: docker:23.0.5

services:
  - name: docker:23.0.5-dind
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

build-app:
  stage: build
  image: node:18-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

docker-compose-up:
  stage: docker-compose-up
  dependencies:
    - build-app
  before_script:
    - apk add --no-cache curl docker-compose
    - until curl -s http://docker:2375/_ping; do echo "Waiting for Docker..."; sleep 1; done
  script:
    - docker-compose up -d

e2e-test:
  stage: test
  image: cypress/browsers:node-22.11.0-chrome-130.0.6723.69-1-ff-132.0-edge-130.0.2849.56-1
  dependencies:
    - docker-compose-up
  script:
    - npm ci
    - npx cypress run --browser chrome --headless
  allow_failure: true

docker-compose-down:
  stage: docker-compose-down
  dependencies:
    - docker-compose-up
  script:
    - docker-compose down

docker-build:
  stage: docker
  dependencies:
    - build-app
  before_script:
    - echo "$DOCKER_PAT" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t szymek8docker/vinylo-frontend:latest .
    - docker push szymek8docker/vinylo-frontend:latest
